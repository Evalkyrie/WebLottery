<!DOCTYPE html>
<html>
    <head>
        <title>Title</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- UIkit CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/css/uikit.min.css" />
        <!-- UIkit JS -->
        <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/js/uikit.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/js/uikit-icons.min.js"></script>
      <script type="module" crossorigin src="/WebLottery/assets/index-Bt0y-bVr.js"></script>
    </head>
    <body>
        <div class="uk-text-center" uk-grid="masonry: next">
            <div class="uk-width-1-3@s uk-width-1-4@m">
                <div class="uk-card uk-card-default uk-card-body">
                    <legend class="uk-legend">Ticket Type</legend>
                    <br>
                    <form id="ticketType">
                        <div class="uk-margin uk-grid-small uk-child-width-auto uk-grid">
                            <label><input id="Basic" class="uk-radio" type="radio" name="ticket" value='0' checked> Basic - $1</label>
                            <label><input id="Standard" class="uk-radio" type="radio" name="ticket" value='1'> Standard - $3</label>
                            <label><input id="Mega" class="uk-radio" type="radio" name="ticket" value='2'> Mega - $5</label>
                        </div>
                        <div class="uk-margin uk-grid-small uk-child-width-auto uk-grid">
                            <label><input id="Powerball" class="uk-checkbox" type="checkbox" name="ticket"> Powerball - $2</label>
                        </div>
                    </form>
                </div>
            </div>
            <div class="uk-width-2-3@s uk-width-1-2@m">
                <div class="uk-card uk-card-default uk-card-body">
                    <legend class="uk-legend">Make Your Picks</legend>
                    <br>
                    <form>
                        <div class="uk-margin">
                            <input id="picks" class="uk-input" type="text" placeholder="Basic - Pick 3" aria-label="Input">
                        </div>
                        <div class="uk-margin">
                            <input id="pbPick" class="uk-input" type="text" placeholder="" aria-label="Input" readonly hidden>
                        </div>
                    </form>
                </div>
            </div>
            <div class="uk-width-1-3@s uk-width-1-4@m">
                <div class="uk-height-small@s uk-card uk-card-default uk-card-body" uk-component="margin: uk-grid-margin">
                    <legend class="uk-legend">Instructions</legend>
                    <article class="uk-article">
                        <p class="uk-article-meta"><b>Basic Ticket</b><br>$1 (3 Picks) 1-20<br><b>Standard Ticket</b><br>$3 (5 Picks) 1-50<br><b>Mega Ticket</b><br>$5 (6 Picks) 1-60<br><b>Powerball Ticket</b><br>Additional $2 (1 Pick) 1-10<br>$10 Value</p>
                    </article>
                </div>
            </div>
            <div class="uk-width-1-3@s uk-width-1-4@m">
                <div class="uk-card uk-card-default uk-card-body">
                    <legend class="uk-legend">Winnings Summary</legend>
                    <article class="uk-article">
                        <h1 class="uk-article-title"></h1>
                        <p id="summary" class="uk-article-meta"><b>Spent:</b> $0<br><b>Winnings:</b> $0<br><b>Profit:</b> $0</p>
                    </article>
                </div>
            </div>
            <div class="uk-width-1-3@s uk-width-1-2@m">
                <div class="uk-card uk-card-default uk-card-body">
                    <legend class="uk-legend uk-width-expand@m">Winning Numbers</legend>
                    <p id="result">0 0 0</p>
                </div>
            </div>
            <div class="uk-width-1-3@s uk-width-1-4@m">
                <div class="uk-child-width-expand@s uk-card uk-card-default uk-card-body">
                    <button id="PLAY" class="uk-button uk-button-primary">PLAY</button>
                </div>
            </div>
            <div class="uk-width-auto@s uk-width-1-4@m"></div>
            <div class="uk-width-1-2@s uk-width-1-2@m">
                <div class="uk-card uk-card-default uk-card-body">
                    <legend class="uk-legend uk-width-expand@m">Outcome</legend>
                    <p id="outcome">You Won $3!</p>
                </div>
            </div>
        </div>
    </body>
</html>
